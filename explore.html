<body>
    <header id="main">
        <nav class="nav-bar">
            <div class="container">
                <div class="logo">
                    <img src="images/main/logo.png" alt="">
                    <h1>Kemet</h1>
                </div>
                <div class="menu">

                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="explore.html">Explore</a></li>
                        <li><a href="booking.html">Booking</a></li>
                        <li><a href="contact_us.html">Contact Us</a></li>
                    </ul>


                </div>
                <div class="utalities">

                    <button class="login" onclick="toggle_popUp()">Register</button>

                    <button class="menu-btn" onclick="show_menu()"><i class="fa-solid fa-bars"></i></button>


                    <div class="themes">
                        <input type="checkbox" class="toggle" id="mode">
                        <label for="mode" class="label"> 
                            <div class="slider">
                                
                            </div>
                            <i class="fa-solid fa-sun light"></i>
                            <i class="fa-regular fa-moon dark"></i>
                        </label>

                    </div>

                </div>
            </div>



        </nav>
    </header>
    <div class="login-popup">
        <div class="container">
            <i class="fa-solid fa-x close_popup"></i>
            <div class="box">
                <div class="head">
                    <h3>Sign Up</h3>
                    <img src="images/main/pharaoh.png" alt="">
                </div>
                <form action="" class="data">
                    <input type="text" placeholder="First Name*" name="first_name" id="first_name">
                    <p class="alert " data-error-name="first_name"></p>
                    <input type="text" placeholder="Last Name*" name="last_name" id="last_name">
                    <p class="alert " data-error-name="last_name"></p>
                    <input type="text" placeholder="Email*" name="email" id="email">
                    <p class="alert " data-error-name="email"></p>
                    <input type="password" placeholder="password*" name="password" id="password">
                    <p class="alert " data-error-name="password"></p>
                </form> <button class="sign-up" onclick="submitForm();"><span>sign-up</span><img src="images/main/eye.png" alt=""></button>
                <div class="user-display">
                    <div class="user-info">

                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="explore-container">
        <a href="giza.html" class="card">
            <img src="images/explore/Giza.jpg" alt="Giza">
            <div class="content">
                <h3 class="vertical-title">
                    <span>G</span>
                    <span>i</span>
                    <span>z</span>
                    <span>a</span>
                </h3>
                <span class="btn-explore">Explore</span>
            </div>
        </a>


        <a href="luxer.html" class="card">
            <img src="images/explore/Luxor.jpg" alt="Luxor">
            <div class="content">
                <h3 class="vertical-title">
                    <span>L</span>
                    <span>U</span>
                    <span>X</span>
                    <span>O</span>
                    <span>R</span>
                </h3>
                <span class="btn-explore">Explore</span>
            </div>
        </a>
        <a href=" aswan.html" class="card">
            <img src="images/explore/Aswan.jpg" alt="Aswan">
            <div class="content">
                <h3 class="vertical-title">
                    <span>A</span>
                    <span>S</span>
                    <span>W</span>
                    <span>A</span>
                    <span>N</span>
                </h3>
                <span class="btn-explore">Explore</span>
            </div>
        </a>

        <a href="cairo.html" class="card">
            <img src="images/explore/Cairo.jpg" alt="Cairo">
            <div class="content">
                <h3 class="vertical-title">
                    <span>C</span>
                    <span>a</span>
                    <span>i</span>
                    <span>r</span>
                    <span>o</span>
                </h3>
                <span class="btn-explore">Explore</span>
            </div>
        </a>
    </div>

        2026 IT Project -- Tourism Company
    </footer>

    <script src="js/index.js"></script>
